oke-linecap="round"/><path d="M1300,215 L805,215" fill="none" stroke="#4c7197" stroke-width="1.3" stroke-dasharray="4 7" opacity="0.25" stroke-linecap="round"/><g class="node" tabindex="0" role="button" aria-label="P1 分布外泛化"><rect x="108" y="140" width="405" height="159" rx="15" fill="#132235" stroke="#42617d" stroke-width="1.25" class="node-bg"/><rect x="122" y="157" width="50" height="24" rx="5" fill="#243c52" stroke="none"/><text x="147" y="169" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#95c8f5" font-weight="800">P1</text><text x="191" y="175" font-size="16" fill="#edf7ff" font-weight="750">分布外泛化</text><text x="124" y="214" font-size="11" fill="#95aec7">Out-of-distribution generalization</text><text x="125" y="244" font-size="11" fill="#b8cde0">模型在新的任务、环境或数据分布下失效。</text><text x="488" y="278" font-size="10" fill="#4c7298" text-anchor="end">10 RELATED FIELDS</text></g><g class="node" tabindex="0" role="button" aria-label="P2 数据效率"><rect x="603" y="140" width="405" height="159" rx="15" fill="#132235" stroke="#42617d" stroke-width="1.25" class="node-bg"/><rect x="617" y="157" width="50" height="24" rx="5" fill="#243c52" stroke="none"/><text x="642" y="169" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#95c8f5" font-weight="800">P2</text><text x="686" y="175" font-size="16" fill="#edf7ff" font-weight="750">数据效率</text><text x="619" y="214" font-size="11" fill="#95aec7">Data &amp; sample efficiency</text><text x="620" y="244" font-size="11" fill="#b8cde0">标注、模拟、交互和实验数据昂贵。</text><text x="983" y="278" font-size="10" fill="#4c7298" text-anchor="end">8 RELATED FIELDS</text></g><g class="node" tabindex="0" role="button" aria-label="P3 推断与计算效率"><rect x="1098" y="140" width="405" height="159" rx="15" fill="#132235" stroke="#42617d" stroke-width="1.25" class="node-bg"/><rect x="1112" y="157" width="50" height="24" rx="5" fill="#243c52" stroke="none"/><text x="1137" y="169" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#95c8f5" font-weight="800">P3</text><text x="1181" y="175" font-size="16" fill="#edf7ff" font-weight="750">推断与计算效率</text><text x="1114" y="214" font-size="11" fill="#95aec7">Inference &amp; compute efficiency</text><text x="1115" y="244" font-size="11" fill="#b8cde0">高维优化、推断和部署的计算成本限制方法。</text><text x="1478" y="278" font-size="10" fill="#4c7298" text-anchor="end">9 RELATED FIELDS</text></g><g class="node" tabindex="0" role="button" aria-label="P4 不确定性与校准"><rect x="108" y="358" width="405" height="159" rx="15" fill="#1a3552" stroke="#b3deff" stroke-width="1.25" class="node-bg"/><rect x="122" y="375" width="50" height="24" rx="5" fill="#28618a" stroke="none"/><text x="147" y="387" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#d9f1ff" font-weight="800">P4</text><text x="191" y="393" font-size="16" fill="#edf7ff" font-weight="750">不确定性与校准</text><text x="124" y="432" font-size="11" fill="#95aec7">Uncertainty &amp; calibration</text><text x="125" y="462" font-size="11" fill="#b8cde0">概率或置信度并不总与真实错误风险一致。</text><text x="488" y="496" font-size="10" fill="#addcff" text-anchor="end">10 RELATED FIELDS</text></g><g class="node" tabindex="0" role="button" aria-label="P5 长期一致性"><rect x="603" y="358" width="405" height="159" rx="15" fill="#132235" stroke="#42617d" stroke-width="1.25" class="node-bg"/><rect x="617" y="375" width="50" height="24" rx="5" fill="#243c52" stroke="none"/><text x="642" y="387" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#95c8f5" font-weight="800">P5</text><text x="686" y="393" font-size="16" fill="#edf7ff" font-weight="750">长期一致性</text><text x="619" y="432" font-size="11" fill="#95aec7">Long-horizon consistency</text><text x="620" y="462" font-size="11" fill="#b8cde0">预测和行动过程中的误差不断传播。</text><text x="983" y="496" font-size="10" fill="#4c7298" text-anchor="end">9 RELATED FIELDS</text></g><g class="node" tabindex="0" role="button" aria-label="P6 因果与干预理解"><rect x="1098" y="358" width="405" height="159" rx="15" fill="#132235" stroke="#42617d" stroke-width="1.25" class="node-bg"/><rect x="1112" y="375" width="50" height="24" rx="5" fill="#243c52" stroke="none"/><text x="1137" y="387" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#95c8f5" font-weight="800">P6</text><text x="1181" y="393" font-size="16" fill="#edf7ff" font-weight="750">因果与干预理解</text><text x="1114" y="432" font-size="11" fill="#95aec7">Causal &amp; intervention understanding</text><text x="1115" y="462" font-size="11" fill="#b8cde0">统计相关不保证干预后的结果正确。</text><text x="1478" y="496" font-size="10" fill="#4c7298" text-anchor="end">8 RELATED FIELDS</text></g><g class="node" tabindex="0" role="button" aria-label="P7 结构与表示"><rect x="108" y="576" width="405" height="159" rx="15" fill="#132235" stroke="#42617d" stroke-width="1.25" class="node-bg"/><rect x="122" y="593" width="50" height="24" rx="5" fill="#243c52" stroke="none"/><text x="147" y="605" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#95c8f5" font-weight="800">P7</text><text x="191" y="611" font-size="16" fill="#edf7ff" font-weight="750">结构与表示</text><text x="124" y="650" font-size="11" fill="#95aec7">Structure &amp; representations</text><text x="125" y="680" font-size="11" fill="#b8cde0">学到的表示可能不具备稳定的语义或组合性。</text><text x="488" y="714" font-size="10" fill="#4c7298" text-anchor="end">10 RELATED FIELDS</text></g><g class="node" tabindex="0" role="button" aria-label="P8 持续适应"><rect x="603" y="576" width="405" height="159" rx="15" fill="#132235" stroke="#42617d" stroke-width="1.25" class="node-bg"/><rect x="617" y="593" width="50" height="24" rx="5" fill="#243c52" stroke="none"/><text x="642" y="605" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#95c8f5" font-weight="800">P8</text><text x="686" y="611" font-size="16" fill="#edf7ff" font-weight="750">持续适应</text><text x="619" y="650" font-size="11" fill="#95aec7">Continual adaptation</text><text x="620" y="680" font-size="11" fill="#b8cde0">环境和任务变化后模型容易遗忘或性能下降。</text><text x="983" y="714" font-size="10" fill="#4c7298" text-anchor="end">8 RELATED FIELDS</text></g><g class="node" tabindex="0" role="button" aria-label="P9 评价与可验证性"><rect x="1098" y="576" width="405" height="159" rx="15" fill="#132235" stroke="#42617d" stroke-width="1.25" class="node-bg"/><rect x="1112" y="593" width="50" height="24" rx="5" fill="#243c52" stroke="none"/><text x="1137" y="605" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#95c8f5" font-weight="800">P9</text><text x="1181" y="611" font-size="16" fill="#edf7ff" font-weight="750">评价与可验证性</text><text x="1114" y="650" font-size="11" fill="#95aec7">Evaluation &amp; verification</text><text x="1115" y="680" font-size="11" fill="#b8cde0">基准与真实能力不一致，研究结果难复现。</text><text x="1478" y="714" font-size="10" fill="#4c7298" text-anchor="end">12 RELATED FIELDS</text></g><g class="node" tabindex="0" role="button" aria-label="P10 安全与协调"><rect x="108" y="794" width="405" height="159" rx="15" fill="#132235" stroke="#42617d" stroke-width="1.25" class="node-bg"/><rect x="122" y="811" width="50" height="24" rx="5" fill="#243c52" stroke="none"/><text x="147" y="823" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#95c8f5" font-weight="800">P10</text><text x="191" y="829" font-size="16" fill="#edf7ff" font-weight="750">安全与协调</text><text x="124" y="868" font-size="11" fill="#95aec7">Safety &amp; coordination</text><text x="125" y="898" font-size="11" fill="#b8cde0">多主体、多目标和真实世界部署引入新风险。</text><text x="488" y="932" font-size="10" fill="#4c7298" text-anchor="end">9 RELATED FIELDS</text></g><g class="node" tabindex="0" role="button" aria-label="P11 物理约束与真实世界映射"><rect x="603" y="794" width="405" height="159" rx="15" fill="#132235" stroke="#42617d" stroke-width="1.25" class="node-bg"/><rect x="617" y="811" width="50" height="24" rx="5" fill="#243c52" stroke="none"/><text x="642" y="823" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#95c8f5" font-weight="800">P11</text><text x="686" y="829" font-size="16" fill="#edf7ff" font-weight="750">物理约束与真实世界映射</text><text x="619" y="868" font-size="11" fill="#95aec7">Physical grounding</text><text x="620" y="898" font-size="11" fill="#b8cde0">视觉或生成的合理性不等于物理可执行性。</text><text x="983" y="932" font-size="10" fill="#4c7298" text-anchor="end">7 RELATED FIELDS</text></g><g class="node" tabindex="0" role="button" aria-label="P12 知识更新与推理可信度"><rect x="1098" y="794" width="405" height="159" rx="15" fill="#132235" stroke="#42617d" stroke-width="1.25" class="node-bg"/><rect x="1112" y="811" width="50" height="24" rx="5" fill="#243c52" stroke="none"/><text x="1137" y="823" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#95c8f5" font-weight="800">P12</text><text x="1181" y="829" font-size="16" fill="#edf7ff" font-weight="750">知识更新与推理可信度</text><text x="1114" y="868" font-size="11" fill="#95aec7">Knowledge &amp; reasoning fidelity</text><text x="1115" y="898" font-size="11" fill="#b8cde0">知识可能过时，推理链易出现隐蔽错误。</text><text x="1478" y="932" font-size="10" fill="#4c7298" text-anchor="end">8 RELATED FIELDS</text></g></g></svg>