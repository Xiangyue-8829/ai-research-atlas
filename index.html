 fullscreenWorkspace.classList.toggle('wide',wide);
 updateWideLabel();
 if(wide){
  // Fullscreen API may be unavailable or blocked (notably in some embedded/mobile browsers).
  // The one-column wide layout remains a functional fallback.
  if(!document.fullscreenElement && typeof fullscreenWorkspace.requestFullscreen==='function'){
   try{const r=fullscreenWorkspace.requestFullscreen();if(r&&typeof r.catch==='function')r.catch(()=>{});}catch(_){}
  }
 }else if(document.fullscreenElement===fullscreenWorkspace && typeof document.exitFullscreen==='function'){
  try{const r=document.exitFullscreen();if(r&&typeof r.catch==='function')r.catch(()=>{});}catch(_){}
 }
}
document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement!==fullscreenWorkspace){fullscreenWorkspace.classList.remove('wide');updateWideLabel();}});
el('wideToggle').onclick=()=>toggleWide();
el('zoomIn').onclick=()=>zoom(1.24);el('zoomOut').onclick=()=>zoom(1/1.24);el('zoomReset').onclick=()=>{scale=1;panX=panY=0;applyTransform()};
el('relToggle').onclick=()=>{showLinks=!showLinks;el('relToggle').textContent=showLinks?L('↗ 隐藏交叉关系','↗ Hide Cross-field Links'):L('↗ 显示交叉关系','↗ Show Cross-field Links');if(view!=='overview')setView('overview');else draw()};
el('resetSelection').onclick=()=>{selected='A5';problem='P4';el('search').value='';query='';renderDirectory();setView('overview')};
function download(contents,name,type='image/svg+xml'){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([contents],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
el('downloadSvg').onclick=()=>{const clone=svg.cloneNode(true);clone.setAttribute('xmlns',NS);clone.setAttribute('width','1600');clone.setAttribute('height','1120');const style=document.createElementNS(NS,'style');style.textContent='text{font-family:Arial,"Microsoft YaHei",sans-serif}';clone.insertBefore(style,clone.firstChild);const bg=document.createElementNS(NS,'rect');bg.setAttribute('x','0');bg.setAttribute('y','0');bg.setAttribute('width','1600');bg.setAttribute('height','1120');bg.setAttribute('fill','#0b1424');clone.insertBefore(bg,clone.firstChild);download(new XMLSerializer().serializeToString(clone),'AI_Research_Atlas_'+view+'.svg')};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(b.dataset.view==='problems'){problem=problem||'P4';}setView(b.dataset.view)});
el('search').addEventListener('input',ev=>{query=ev.target.value;renderDirectory();});
el('aboutLink').onclick=e=>{e.preventDefault();alert(L('AI Research Atlas V1.2\n\n来源：主流 AI 学术会议研究分类与相关研究报告。\n\n数据结构：7 个研究层、29 个研究领域、323 个细分主题、12 个跨领域瓶颈及 66 条关系。\n\n领域发展状态和开放问题是编辑性总结，不是官方排名，也不是已验证的因果结论。\n\n支持中英文内容切换；研究数据可通过 JSON 文件持续维护。','AI Research Atlas V1.2\n\nSources: Research taxonomies from leading AI conferences and selected research reports.\n\nStructure: 7 research layers, 29 core fields, 323 subtopics, 12 shared bottlenecks, and 66 relationships.\n\nResearch status and open questions are editorial syntheses—not official ratings or established causal claims.\n\nThe interface and research content support English and Chinese; data can be maintained as JSON.'))};
el('metric-layers').textContent=data.layers.length;el('metric-domains').textContent=data.domains.length;el('metric-topics').textContent=data.domains.reduce((n,d)=>n+d.topics.length,0);el('metric-problems').textContent=data.problems.length;
const fromHash=location.hash.slice(1);if(byId[fromHash]){selected=fromHash;view='focus';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
document.querySelectorAll('.language-toggle [data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
applyStaticTranslations();renderDirectory();draw();inspector();
})();
</script>
</body></html>
