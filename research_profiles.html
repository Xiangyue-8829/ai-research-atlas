<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08101b;color:#eef4fd;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}a{color:#8bc9ff;text-decoration:none}a:hover{text-decoration:underline}button{font:inherit;cursor:pointer}.bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:12px;align-items:center;background:#0e1a2aee;padding:14px max(20px,calc((100vw - 1180px)/2));border-bottom:1px solid #24364c;backdrop-filter:blur(12px)}.brand{font-weight:800;letter-spacing:.08em}.small{color:#91a8be;font-size:12px}.layout{max-width:1180px;margin:34px auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding:0 20px}.panel{background:#101c2b;border:1px solid #2b3d51;border-radius:16px;padding:22px}.side{height:max-content;position:sticky;top:88px}.side h3{font-size:13px;color:#90a9c2;margin:0 0 12px}.pick{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#becddd;border-radius:10px;padding:13px 10px;margin:4px 0}.pick:hover,.pick.active{background:#1c3048;border-color:#3b5e7d;color:white}.pick span{display:block;font-size:11px;color:#89abc7}.hero{padding:12px 2px 20px}.tag{font-size:11px;font-weight:700;color:#8ec5ff;letter-spacing:.16em}.hero h1{font-size:clamp(25px,4vw,39px);line-height:1.2;margin:10px 0}.en{font-size:18px;color:#8fb6d9}.summary{color:#c8d7e6}.math{background:#081728;border:1px solid #274465;border-radius:12px;font-family:Consolas,monospace;overflow:auto;padding:15px;color:#b7dfff}.block{margin:20px 0}.block h2{font-size:18px;margin:0 0 12px}.item{padding:13px 15px;border:1px solid #2b3d52;border-radius:11px;background:#132137;margin:9px 0}.item strong{display:block;margin-bottom:4px}.item p{margin:2px 0;color:#afc3d8;font-size:14px}.label{font-size:11px;border:1px solid #4d6682;border-radius:99px;padding:2px 8px;color:#bbdafa;display:inline-block;margin:4px 0 8px}.note{background:#182838;border-left:3px solid #75b2f2;padding:13px 16px;font-size:13px;color:#d4e0ec;border-radius:5px}.related{display:inline-block;padding:7px 11px;margin:4px;background:#1d3148;border:1px solid #38526e;border-radius:9px;font-size:13px}.paper{display:block;border-bottom:1px solid #27384d;padding:9px 0}.paper em{display:block;font-style:normal;color:#9ab0c6;font-size:12px}.empty{font-size:13px;color:#8fa4b9}footer{padding:20px;color:#748aa0;text-align:center;font-size:12px}@media(max-width:780px){.layout{display:block;margin-top:12px}.side{position:static;margin-bottom:18px;padding:14px}.side h3{margin:0}.pick{margin:3px 0}.panel{padding:18px}.bar{padding:12px 16px}.bar .small{display:none}}

.language-toggle{display:inline-flex;gap:3px;align-items:center;border:1px solid #36506b;background:#101b2d;border-radius:10px;padding:3px;white-space:nowrap}

<body><header class="bar"><a id="back-brand" href="./index.html" class="brand">◈ AI RESEARCH ATLAS</a><span class="small" data-ui="subtitle">V1.2 · 有证据支持的深度研究档案</span><div class="header-actions"><a id="back" href="./index.html" data-ui="back">返回全局地图 ↗</a><div class="language-toggle" role="group" aria-label="Language / 语言"><button type="button" data-lang="zh" aria-pressed="true">中文</button><button type="button" data-lang="en" aria-pressed="false">English</button></div></div></header>
<div class="layout"><aside class="panel side"><h3 data-ui="menuHeading">首批研究档案</h3><div id="menu"></div><p class="small" data-ui="menuNote">三个主题为首批试点。</p></aside><main id="main" class="panel" aria-live="polite">正在读取研究档案…</main></div><footer data-ui="footer">AI Research Atlas · 更新时间：2026-11-15</footer>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UI={
 subtitle:{zh:'V1.2 · 有证据支持的深度研究档案',en:'V1.2 · Evidence-linked in-depth research profiles'},
 back:{zh:'返回全局地图 ↗',en:'Back to Global Atlas ↗'},
 menuHeading:{zh:'首批研究档案',en:'Pilot Research Profiles'},
 menuNote:{zh:'三个主题为首批试点，其他领域仍在逐步扩展；不是系统性文献综述。',en:'These three topics are pilots. Other fields remain under development; this is not a systematic literature review.'},
 footer:{zh:'AI Research Atlas · 编辑性研究综述，不替代原始论文阅读。更新时间：2026-11-15',en:'AI Research Atlas · Editorial research synthesis, not a substitute for primary sources. Updated: 2026-11-15'},
 loading:{zh:'正在读取研究档案…',en:'Loading research profiles…'},
 core:{zh:'核心研究问题',en:'Central research question'},status:{zh:'发展状态',en:'Research status'},methods:{zh:'研究方法谱系',en:'Methods and approaches'},
 advances:{zh:'代表性研究进展',en:'Representative research developments'},bottlenecks:{zh:'具体瓶颈与证据级别',en:'Bottlenecks and evidence levels'},
 caveat:{zh:'“文献明确指出”指原始资料直接描述的限制；“归纳”是编辑性综合；“研究假设”尚需检验。',en:'“Explicit in source” denotes limitations directly described in the cited work; “Editorial synthesis” draws connections across sources; “Research hypothesis” requires further testing.'},
 opportunities:{zh:'潜在研究问题（非已证实结论）',en:'Potential research opportunities (not established findings)'},
 limitations:{zh:'验证边界',en:'Validation caveat'},related:{zh:'跨领域联系',en:'Cross-field connections'},references:{zh:'参考论文与研究资料',en:'Papers and research sources'},
 source:{zh:'来源',en:'Source'},sources:{zh:'参考',en:'References'},ongoing:{zh:'持续更新',en:'Ongoing'},
 note:{zh:'资料状态：首批试点研究档案；非系统性文献综述。发展状态依据列出的资料作编辑性总结，不代表公认排名、最新 SOTA 或已证实的因果关系。',en:'Status: pilot editorial research profiles, not a systematic literature review. Research status reflects a synthesis of cited sources, not an authoritative ranking, latest SOTA, or established causal relationship.'},
 failed:{zh:'研究数据加载失败，请确认研究 JSON 文件与页面位于同一目录，并通过 GitHub Pages 打开。',en:'Research data could not be loaded. Check that the JSON files are alongside this page and open it through GitHub Pages.'}
};
function initialLang(){const value=new URLSearchParams(location.search).get('lang');if(['zh','en'].includes(value))return value;try{const v=localStorage.getItem('ai-atlas-language');if(['zh','en'].includes(v))return v}catch(_){}return 'zh'}
let lang=initialLang(), D=null, DE=null;
const tr=k=>UI[k][lang];
const colon=()=>lang==='en'?':':'：';
const sourceKind=k=>lang==='zh'?k:({'同行评审论文':'Peer-reviewed article','同行评审综述':'Peer-reviewed review','研究团队技术公告':'Research team announcement','研究技术报告':'Technical research report','项目技术文档':'Project documentation'}[k]||k);
const menu=document.getElementById('menu'),main=document.getElementById('main');
function switchLang(v){if(!['zh','en'].includes(v))return;lang=v;try{localStorage.setItem('ai-atlas-language',lang)}catch(_){}const u=new URL(location.href);u.searchParams.set('lang',lang);try{history.replaceState(null,'',u.href)}catch(_){}renderStatic();if(D)select(location.hash.slice(1))}
function renderStatic(){document.documentElement.lang=lang==='en'?'en':'zh-CN';document.title=lang==='en'?'Research Profiles · AI Research Atlas':'深度研究档案 · AI Research Atlas';document.querySelectorAll('[data-ui]').forEach(e=>{e.textContent=tr(e.dataset.ui)});document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.getElementById('back').href='./index.html?lang='+lang;document.getElementById('back-brand').href='./index.html?lang='+lang;}
function getField(p,field){return lang==='en'?DE.profiles[p.id][field]:p[field]}
function refs(ids){return ids.map(id=>{const s=D.sources[id];return s?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.venue||s.title)} ↗</a>`:''}).filter(Boolean).join(' · ')}
function select(slug){const p=D.profiles.find(x=>x.slug===slug)||D.profiles[0];try{history.replaceState(null,'',location.pathname+location.search+'#'+p.slug)}catch(_){}
menu.innerHTML=D.profiles.map(x=>`<button class="pick ${x.slug===p.slug?'active':''}" data-slug="${esc(x.slug)}">${esc(lang==='en'?x.en:x.zh)}${lang==='zh'?`<span>${esc(x.en)}</span>`:''}</button>`).join('');menu.querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.slug));
const list=(arr,fn)=>arr.map(fn).join(''),methods=getField(p,'methods'),timeline=getField(p,'timeline'),bottlenecks=getField(p,'bottlenecks'),links=getField(p,'links'),opportunities=getField(p,'opportunities');
main.innerHTML=`<section class="hero"><div class="tag">${esc(p.id)} · EVIDENCE-LINKED RESEARCH PROFILE</div><h1>${esc(lang==='en'?p.en:p.zh)}</h1>${lang==='zh'?`<div class="en">${esc(p.en)}</div>`:''}<p class="summary">${esc(getField(p,'scope'))}</p><div class="note"><b>${tr('core')}</b><div>${esc(getField(p,'question'))}</div></div><p class="math">${esc(p.math)}</p><p class="summary"><b>${tr('status')}${colon()}</b>${esc(getField(p,'status'))}</p></section>
<section class="block"><h2>${tr('methods')}</h2>${list(methods,m=>`<div class="item"><strong>${esc(m[0])}</strong><p>${esc(m[1])}</p></div>`)}</section>
<section class="block"><h2>${tr('advances')}</h2>${list(timeline,(t,i)=>`<div class="item"><strong>${esc(t[0])}</strong><p>${esc(t[1])}</p><p class="small">${tr('source')}${colon()} ${refs(p.timeline[i][2])}</p></div>`)}</section>
<section class="block"><h2>${tr('bottlenecks')}</h2><p class="small">${tr('caveat')}</p>${list(bottlenecks,(b,i)=>`<div class="item"><strong>${esc(b[0])}</strong><span class="label">${esc(b[2])}</span><p>${esc(b[1])}</p><p class="small">${tr('sources')}${colon()} ${refs(p.bottlenecks[i][3])}</p></div>`)}</section>
<section class="block"><h2>${tr('opportunities')}</h2>${list(opportunities,o=>`<div class="item"><strong>${esc(o[0])}</strong><p>${esc(o[1])}</p><p><b>${tr('limitations')}${colon()}</b>${esc(o[2])}</p></div>`)}</section>
<section class="block"><h2>${tr('related')}</h2>${list(links,(name,i)=>`<a class="related" href="./index.html?lang=${lang}#${encodeURIComponent(p.links[i][0])}" title="${esc(lang==='en'?name:p.links[i][1])}">${esc(p.links[i][0])} · ${esc(lang==='en'?name:p.links[i][1])} ↗</a>`)}</section>
<section class="block"><h2>${tr('references')}</h2>${list([...new Set([...p.timeline.flatMap(x=>x[2]),...p.bottlenecks.flatMap(x=>x[3])])],id=>{const s=D.sources[id];return s?`<a class="paper" target="_blank" rel="noopener noreferrer" href="${esc(s.url)}">${esc(s.title)} <em>${esc(s.venue)} · ${esc(s.year||tr('ongoing'))} · ${esc(sourceKind(s.kind))}</em></a>`:''})}</section><div class="note">${tr('note')}</div>`;
}
async function init(){renderStatic();try{
const [r,p]=await Promise.all([fetch('./research_profiles_2026.json',{cache:'no-store'}),fetch('./research_profiles_en_2026.json',{cache:'no-store'})]);if(!r.ok||!p.ok)throw Error('HTTP error');D=await r.json();DE=await p.json();select(location.hash.slice(1));
}catch(err){main.textContent=tr('failed')+' '+err.message}}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>switchLang(b.dataset.lang)));
window.addEventListener('hashchange',()=>{if(D)select(location.hash.slice(1))});init();
</script></body></html>
