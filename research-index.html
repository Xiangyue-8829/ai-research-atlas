<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081425"><title>研究领域索引 · AI Research Atlas</title><meta name="description" content="Browse 29 core AI research fields and their finer research topics."><link rel="stylesheet" href="./assets/research-profile.css"><style>.directory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.directory a{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:18px;display:block;color:var(--txt)}.directory a:hover{border-color:var(--accent);text-decoration:none}.directory small{display:block;color:var(--muted);margin-top:6px}.group-title{margin:36px 0 16px;color:var(--accent);font-size:15px}.dir-note{color:var(--muted);line-height:1.7}@media(max-width:800px){.directory{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.directory{grid-template-columns:1fr}}</style></head>
<body><header class="header"><a class="brand" href="./index.html">◎ AI Research Atlas</a><nav class="nav"><a href="./index.html">研究地图</a><a href="./knowledge-graph.html">知识图谱</a><button id="lang">EN</button></nav></header><main class="shell"><section class="hero"><p class="eyebrow">RESEARCH LIBRARY · 2026</p><h1 id="heading">29 个研究领域档案</h1><p id="desc" class="dir-note">从领域概览进入细分专题、研究论文与跨领域关系。部分专题仍在编辑和文献核验中。</p></section><div id="library" aria-live="polite">正在加载研究领域…</div></main><footer>AI Research Atlas · Research field index</footer>
<script>
(()=>{'use strict';let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'zh';let atlas;const root=document.getElementById('library'),$=x=>document.getElementById(x);function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';$('lang').textContent=lang==='zh'?'EN':'中文';$('heading').textContent=lang==='zh'?'29 个研究领域档案':'29 research field profiles';$('desc').textContent=lang==='zh'?'从领域概览进入细分专题、研究论文与跨领域关系。部分专题仍在编辑和文献核验中。':'Explore research domains, topics, references, and cross-field connections. Some dossiers are still under review.';root.replaceChildren();for(const layer of atlas.layers){const h=document.createElement('h2');h.className='group-title';h.textContent=`${layer.id} · ${lang==='zh'?layer.zh:layer.en}`;root.append(h);const grid=document.createElement('div');grid.className='directory';for(const d of atlas.domains.filter(d=>d.layer===layer.id)){const a=document.createElement('a');a.href=`./research/${d.id}/?lang=${lang}`;a.textContent=`${d.id} · ${lang==='zh'?d.zh:d.en}`;const small=document.createElement('small');small.textContent=`${d.topics.length} ${lang==='zh'?'个可探索的细分主题':'navigable research topics'}`;a.append(small);grid.append(a)}root.append(grid)}}fetch('./ai_research_atlas_data_2026.json').then(r=>{if(!r.ok)throw Error('Missing Atlas data');return r.json()}).then(x=>{atlas=x;render();$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';const p=new URLSearchParams(location.search);p.set('lang',lang);history.replaceState(null,'',location.pathname+'?'+p);render()}}).catch(e=>{root.textContent='Research data unavailable: '+e.message})})();
</script></body></html>
